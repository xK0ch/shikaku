services:
  shikaku:
    build: .
    container_name: shikaku
    networks:
      - proxy-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.shikaku.rule=Host(`shikaku.fynn-koch.de`)
      - traefik.http.routers.shikaku.entrypoints=websecure
      - traefik.http.routers.shikaku.tls.certresolver=letsencrypt
      - traefik.http.services.shikaku.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  proxy-net:
    name: proxy-net
    external: true
