[package]
name = "shikaku"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Shikaku game"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
console_error_panic_hook = "0.1"
rand = "0.10.2"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
